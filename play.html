<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aero Arcade — loading</title>
<link rel="stylesheet" href="./styles.css?v=2026-10-04-b">
<!-- The tab icon. This was href="data:,", an empty placeholder that renders
     nothing, so the browser tab was blank. -->
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=2026-10-04-b">
<link rel="apple-touch-icon" href="./assets/icon.svg?v=2026-10-04-b">
</head>
<body class="player-page">
<div class="backdrop" aria-hidden="true"></div>
<div class="scenery scenery--player" aria-hidden="true">
  <div class="scenery__sun"></div>
  <div class="scenery__cloud scenery__cloud--a"></div>
  <div class="scenery__cloud scenery__cloud--b"></div>
  <div class="scenery__bubble scenery__bubble--2"></div>
  <div class="scenery__bubble scenery__bubble--4"></div>
</div>

<div class="shell">
<header class="player-head panel">
  <a id="back" class="btn btn--ghost" href="./index.html">&larr; All games</a>
  <div class="player-head__text">
    <h1 id="title">Loading…</h1>
    <p id="meta" class="player-meta"></p>
  </div>
  <button id="fullscreen" class="btn btn--aqua" type="button">Fullscreen</button>
  <button id="theme-toggle" class="btn btn--ghost" type="button">Theme: Frutiger Aero</button>

  <!-- MSN Messenger contact card, same as the index page. -->
  <div class="msn" data-msn data-open="false">
    <button class="msn__toggle" type="button" data-msn-toggle aria-expanded="false">
      <span class="msn__face-wrap">
        <img class="msn__face" data-msn-face src="./assets/avatars/avatar-01.svg?v=2026-10-04-b" alt="" width="36" height="36">
        <span class="msn__dot" data-msn-dot></span>
      </span>
      <span class="msn__text">
        <span class="msn__label" data-msn-label>Online</span>
      </span>
    </button>
    <div class="msn__panel" data-msn-panel hidden>
      <p class="msn__hint" data-msn-hint></p>
      <h2 class="msn__title">Display picture</h2>
      <div class="msn__grid" data-msn-grid role="group" aria-label="Choose a display picture"></div>
      <h2 class="msn__title">Status</h2>
      <div class="msn__statuses" data-msn-statuses role="group" aria-label="Choose a status"></div>
      <label class="msn__nick-row">
        <span>Nickname</span>
        <input type="text" class="msn__nick" data-msn-nick maxlength="18" autocomplete="off" spellcheck="false">
      </label>
    </div>
  </div>
</header>
<div id="stage" class="stage">
  <iframe id="frame" class="stage__frame" title="game" allow="fullscreen; autoplay; gamepad"></iframe>
</div>
<p class="hint">Press <kbd>Esc</kbd> to go back. Fullscreen is the way to play.</p>
</div>
<script type="module">
  import { initPlayer } from './src/play.js?v=2026-10-04-b';
  import { gameSlugFromSearch } from './src/router.js?v=2026-10-04-b';

  const slug = gameSlugFromSearch(window.location.search);
  const response = await fetch('./games.config.json?v=2026-10-04-b');
  const config = await response.json();
  initPlayer({ window, config, slug });
</script>
<script type="module">
  import { initThemeButton } from './src/theme-ui.js?v=2026-10-04-b';
  import { initAvatar } from './src/avatar-ui.js?v=2026-10-04-b';
  initThemeButton(window);
  initAvatar(document);
</script>
</body>
</html>
