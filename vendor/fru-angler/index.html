<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutiger Angler</title>
<style>
  /* The same Aero aqua glass as every other game in the arcade. Colours are
     hardcoded here on purpose: games live in their own documents and must stay
     copyable, so they cannot reach the site stylesheet. */
  :root {
    --deep: #01579b;
    --ink-soft: #3d6b85;
    --glass: linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,.3) 55%, rgba(255,255,255,.16));
    --ease: cubic-bezier(.22,.61,.36,1);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: linear-gradient(180deg, #e1f5fe, #b3e5fc 55%, #f4fbff);
    color: var(--deep);
    font: 16px "Segoe UI", Frutiger, system-ui, sans-serif;
    overflow: hidden;
  }

  .stage {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 0.6rem;
    padding: 0.75rem;
  }

  /* ------------------------------------------------------------- top bar */
  .hud {
    display: flex; align-items: center; gap: 0.5rem 0.7rem; flex-wrap: wrap;
    padding: 0.4rem 0.9rem; border-radius: 999px;
    background: var(--glass);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 6px 14px rgba(1,87,155,.18), inset 0 1px 0 #fff;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  }
  .hud b { font-variant-numeric: tabular-nums; }
  .hud__spacer { flex: 1 1 auto; }

  kbd {
    font: inherit; font-size: .82em;
    padding: .05em .4em; border-radius: 5px;
    background: rgba(255,255,255,.75);
    border: 1px solid rgba(1,87,155,.25);
    box-shadow: inset 0 -1px 0 rgba(1,87,155,.2);
  }

  /* ----------------------------------------------------------- the lake */
  .lake {
    position: relative;
    border-radius: 18px;
    background: linear-gradient(180deg, #cdeafb 0%, #7fc4e8 45%, #2f81c4 100%);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 18px 40px rgba(1,87,155,.22), inset 0 1px 0 rgba(255,255,255,.5);
    overflow: hidden;
    min-height: 0;
    cursor: pointer;
    touch-action: none;
  }
  /* Static ripple texture so the water is not a flat gradient. */
  .lake::before {
    content: ""; position: absolute; inset: 0;
    background:
      repeating-linear-gradient(100deg, rgba(255,255,255,.10) 0 2px, transparent 2px 26px),
      radial-gradient(120% 60% at 50% 108%, rgba(255,255,255,.22), transparent 60%);
    pointer-events: none;
  }

  .lake__bobber {
    position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #fff, #e53935 62%);
    box-shadow: 0 4px 10px rgba(0,0,0,.3);
    transform: translate(-50%, -50%);
    z-index: 2;
    transition: left var(--cast-ms, 600ms) var(--ease), top var(--cast-ms, 600ms) var(--ease);
  }

  .lake__splash {
    position: absolute; width: 46px; height: 14px; border-radius: 50%;
    border: 2px solid rgba(255,255,255,.85);
    transform: translate(-50%, -50%);
    opacity: 0; pointer-events: none; z-index: 1;
  }
  .lake__splash.is-on { animation: splash 700ms ease-out; }
  @keyframes splash {
    from { opacity: .9; width: 20px; height: 8px; }
    to   { opacity: 0; width: 90px; height: 26px; }
  }

  /* SHAKE prompt, exactly as in Fisch. */
  .shake {
    position: absolute; z-index: 6;
    padding: 0.45rem 0.9rem; border-radius: 999px;
    background: linear-gradient(180deg, #fff, #d8ecfa);
    border: 2px solid var(--deep);
    color: var(--deep); font: inherit; font-weight: 700; letter-spacing: .06em;
    box-shadow: 0 8px 18px rgba(1,87,155,.3);
    cursor: pointer;
    animation: shake-pulse 600ms ease-in-out infinite alternate;
  }
  @keyframes shake-pulse { from { transform: scale(1); } to { transform: scale(1.07); } }

  /* --------------------------------------------------- the reeling bars */
  .reel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(92%, 34rem); padding: 1rem; z-index: 5;
    border-radius: 16px;
    background: var(--glass);
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 18px 40px rgba(1,87,155,.3), inset 0 1px 0 #fff;
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .reel[hidden] { display: none; }
  .reel__track {
    position: relative; height: 54px; border-radius: 10px;
    background: linear-gradient(180deg, #0f3d5c, #1d5b80);
    border: 1px solid rgba(255,255,255,.35);
    overflow: hidden;
  }
  .reel__player {
    position: absolute; top: 0; bottom: 0; left: 0; width: 24%;
    background: rgba(255,255,255,.85);
    box-shadow: 0 0 12px rgba(255,255,255,.7);
  }
  .reel__fish {
    position: absolute; top: 6px; bottom: 6px; left: 50%; width: 3px;
    background: #ffd54f; box-shadow: 0 0 10px rgba(255,213,79,.9);
  }
  .reel__progress {
    position: relative; height: 16px; margin-top: .6rem; border-radius: 8px;
    background: #0f3d5c; border: 1px solid rgba(255,255,255,.3); overflow: hidden;
  }
  .reel__fill {
    position: absolute; inset: 0 auto 0 0; width: 0;
    background: linear-gradient(90deg, #a3e635, #2e9e5b);
  }
  .reel__hint { margin: .5rem 0 0; font-size: .82rem; color: var(--ink-soft); text-align: center; }

  /* ------------------------------------------------------ cast power bar */
  .cast {
    position: absolute; left: 50%; bottom: 2rem; transform: translateX(-50%);
    width: min(70%, 22rem); height: 20px; border-radius: 999px; z-index: 4;
    background: linear-gradient(180deg, #0f3d5c, #1d5b80);
    border: 1px solid rgba(255,255,255,.5); overflow: hidden;
  }
  .cast[hidden] { display: none; }
  .cast__band { position: absolute; top: 0; bottom: 0; left: 45%; width: 10%; background: rgba(163,230,53,.85); }
  .cast__fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #4fc3f7, #01579b); }

  /* ---------------------------------------------------------- catch card */
  .catch {
    position: absolute; inset: 0; z-index: 8;
    display: grid; place-items: center;
    background: rgba(6, 51, 79, .45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .catch[hidden] { display: none; }
  .catch__card {
    padding: 1.4rem 1.8rem; border-radius: 18px; text-align: center;
    background: linear-gradient(180deg, rgba(255,255,255,.94), rgba(255,255,255,.7));
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 20px 44px rgba(1,87,155,.4), inset 0 1px 0 #fff;
  }
  .catch__name { font-size: 1.5rem; font-weight: 700; }
  .catch__meta { color: var(--ink-soft); margin-top: .3rem; }
  .catch__value { font-size: 1.6rem; font-weight: 700; margin-top: .6rem; }

  /* ------------------------------------------------------------- shop */
  .shop {
    position: absolute; inset: 0; z-index: 9;
    display: grid; place-items: center; padding: 1rem;
    background: rgba(6, 51, 79, .45);
    backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
  }
  .shop[hidden] { display: none; }
  .shop__panel {
    width: min(100%, 30rem); max-height: 84%; overflow: auto;
    padding: 1.1rem 1.2rem; border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,.96), rgba(255,255,255,.78));
    border: 1px solid rgba(255,255,255,.9);
    box-shadow: 0 20px 44px rgba(1,87,155,.4), inset 0 1px 0 #fff;
  }
  .shop__title { font-size: 1.15rem; font-weight: 700; margin: 0 0 .2rem; }
  .shop__wallet { color: var(--ink-soft); margin: 0 0 .8rem; }
  .shop__list { display: grid; gap: .5rem; }
  .rod {
    display: grid; gap: .2rem; text-align: left;
    padding: .6rem .7rem; border-radius: 12px;
    border: 1px solid rgba(1,87,155,.18);
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.5));
    font: inherit; color: inherit; cursor: pointer;
  }
  .rod:disabled { cursor: not-allowed; opacity: .55; }
  .rod--equipped { border-color: var(--deep); box-shadow: 0 0 0 2px rgba(1,87,155,.18) inset; }
  .rod__row { display: flex; justify-content: space-between; gap: .6rem; font-weight: 600; }
  .rod__stats { font-size: .8rem; color: var(--ink-soft); }
  .rod__blurb { font-size: .82rem; color: var(--ink-soft); font-style: italic; }

  .btn {
    padding: .45rem 1rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.92);
    background: linear-gradient(180deg, #fff, rgba(255,255,255,.45));
    color: var(--deep); font: inherit; cursor: pointer;
    box-shadow: 0 4px 10px rgba(1,87,155,.2), inset 0 1px 0 #fff;
  }
  .btn--primary { background: linear-gradient(180deg, #4fc3f7, #01579b); color: #fff; }

  .message {
    position: absolute; inset: 0; display: grid; place-items: center;
    text-align: center; padding: 2rem; color: #fff; font-size: 1.05rem;
    text-shadow: 0 2px 8px rgba(1,40,70,.6); pointer-events: none; z-index: 3;
  }
  .message[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <span>¤ <b id="coins">0</b></span>
      <span>Rod <b id="rod">—</b></span>
      <span class="hud__spacer"></span>
      <span id="rod-stats" style="color:var(--ink-soft)"></span>
    </div>

    <div class="lake" id="lake">
      <div class="lake__splash" id="splash"></div>
      <div class="lake__bobber" id="bobber" style="left:50%;top:34%"></div>

      <div class="cast" id="cast" hidden aria-hidden="true">
        <div class="cast__band"></div>
        <div class="cast__fill" id="cast-fill"></div>
      </div>

      <div class="reel" id="reel" hidden>
        <div class="reel__track" id="reel-track">
          <div class="reel__player" id="reel-player"></div>
          <div class="reel__fish" id="reel-fish"></div>
        </div>
        <div class="reel__progress"><div class="reel__fill" id="reel-fill"></div></div>
        <p class="reel__hint">Hold <kbd>Space</kbd> or press and hold — keep the yellow line inside the white bar</p>
      </div>

      <div class="catch" id="catch" hidden>
        <div class="catch__card">
          <div class="catch__name" id="catch-name">—</div>
          <div class="catch__meta" id="catch-meta"></div>
          <div class="catch__value" id="catch-value">—</div>
          <button class="btn btn--primary" id="catch-again" type="button">Cast again</button>
        </div>
      </div>

      <div class="shop" id="shop-panel" hidden>
        <div class="shop__panel" role="dialog" aria-modal="true" aria-labelledby="shop-title">
          <h2 class="shop__title" id="shop-title">Rods</h2>
          <p class="shop__wallet">You have <b id="shop-coins">¤0</b></p>
          <div class="shop__list" id="shop-list"></div>
          <p style="margin:.9rem 0 0"><button class="btn" id="shop-close" type="button">Close</button></p>
        </div>
      </div>

      <p class="message" id="message" hidden></p>
    </div>

    <div class="hud" style="justify-content:center">
      <button class="btn" id="shop-open" type="button">Rods &amp; shop</button>
      <span id="bestiary" style="color:var(--ink-soft)"></span>
      <span class="hud__spacer"></span>
      <span style="color:var(--ink-soft)">Hold <kbd>Space</kbd> to cast</span>
    </div>
  </div>

  <script type="module" src="./angler.js?v=2026-10-01-a"></script>
</body>
</html>
