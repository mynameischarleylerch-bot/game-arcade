<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Frutiger Angler</title>
<style>
  /* Flat pixel art, from the reference image: three flat colours, no gradients,
     no glass, no blur, no shadows. Proportions follow the drawing — sky to about
     60%, a stepped indigo horizon that rises to the right, a wooden pier on the
     left with a deck and two legs, the angler on it with the rod angled up and
     to the right.

     sky   #00a2e8    indigo  #3f48cc    wood  #b97a57    ink #ffffff

     Every gameplay rule lives in fishing.js and reel.js; this file is the view. */
  :root {
    --sky: #00a2e8;
    --indigo: #3f48cc;
    --wood: #b97a57;
    --ink: #ffffff;
    --dim: #b8bdf0;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0; height: 100%;
    background: var(--sky);
    color: var(--ink);
    font: 14px/1.4 "Lucida Console", "DejaVu Sans Mono", Consolas, monospace;
    overflow: hidden;
  }

  .stage {
    height: 100dvh;
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  /* ------------------------------------------------------------- top bar */
  .hud {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--indigo);
    border-bottom: 4px solid var(--sky);
  }
  .hud b { color: var(--sky); }
  .hud__spacer { flex: 1 1 auto; }
  .hud__stat, .hud__dim { color: var(--dim); }

  kbd {
    font: inherit; color: var(--ink);
    background: var(--indigo); border: 2px solid var(--sky);
    padding: 0 4px;
  }

  /* -------------------------------------------------------------- scene */
  .lake {
    position: relative;
    overflow: hidden;
    min-height: 0;
    background: var(--sky);
    cursor: pointer;
    touch-action: none;
    user-select: none;
  }

  /* The scenery is one crisp-edged SVG at percentage coordinates, so the
     composition holds at any size. */
  .scene {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    shape-rendering: crispEdges;
  }

  .scene__glint { fill: #5a63d8; }
  .scene__angler { fill: var(--indigo); }
  .scene__wood { fill: var(--wood); }
  .scene__rod { stroke: var(--wood); stroke-width: 1.8; fill: none; }

  /* The fishing line runs from the rod tip to the bobber. angler.js rewrites the
     far end whenever the bobber moves. */
  #line {
    stroke: var(--indigo);
    stroke-width: 1.4;
    fill: none;
    vector-effect: non-scaling-stroke;
  }

  /* ---------------------------------------------------------- the bobber */
  .lake__bobber {
    position: absolute;
    width: 16px; height: 16px;
    margin: -8px 0 0 -8px;
    background: var(--wood);
    border: 2px solid var(--indigo);
    z-index: 3;
    transition: left var(--cast-ms, 600ms) linear, top var(--cast-ms, 600ms) linear;
  }
  /* Once it is in the water it reads as a float: indigo with a wood rim. */
  .lake[data-phase="waiting"] .lake__bobber,
  .lake[data-phase="reeling"] .lake__bobber,
  .lake[data-phase="result"] .lake__bobber {
    background: var(--indigo); border-color: var(--wood);
  }

  .lake__splash {
    position: absolute;
    width: 32px; height: 32px; margin: -16px 0 0 -16px;
    border: 4px solid var(--ink);
    z-index: 2;
    opacity: 0;
  }
  .lake__splash.is-on { animation: splash 640ms steps(4, end); }
  @keyframes splash {
    0%   { opacity: 1; transform: scale(.3); }
    100% { opacity: 0; transform: scale(2); }
  }

  /* -------------------------------------------------------- cast meter */
  .cast {
    position: absolute; left: 50%; bottom: 24px; transform: translateX(-50%);
    width: min(70%, 320px); height: 20px;
    background: var(--indigo);
    border: 2px solid var(--ink);
    z-index: 5;
  }
  .cast[hidden] { display: none; }
  /* The "perfect" band is wood, staying inside the three-colour palette. */
  .cast__band { position: absolute; top: 0; bottom: 0; left: 45%; width: 10%; background: var(--wood); }
  .cast__fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--sky); }

  /* ------------------------------------------------------ SHAKE prompt */
  .shake {
    position: absolute; z-index: 8;
    padding: 6px 10px;
    background: var(--indigo);
    color: var(--ink);
    border: 4px solid var(--wood);
    font: inherit; font-weight: 700; letter-spacing: .12em;
    cursor: pointer;
    animation: blink 480ms steps(2, end) infinite;
  }
  @keyframes blink { 50% { background: var(--wood); color: var(--indigo); } }

  /* -------------------------------------------------------- reel panel */
  .reel {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: min(94%, 380px); padding: 12px;
    background: var(--indigo);
    border: 4px solid var(--ink);
    z-index: 7;
  }
  .reel[hidden] { display: none; }
  .reel__track {
    position: relative; height: 44px;
    background: var(--sky);
    border: 2px solid var(--indigo);
    overflow: hidden;
  }
  .reel__player { position: absolute; top: 0; bottom: 0; left: 0; width: 24%; background: var(--ink); }
  .reel__fish { position: absolute; top: 4px; bottom: 4px; left: 50%; width: 4px; margin-left: -2px; background: var(--wood); }

  .reel__progress {
    position: relative; height: 12px; margin-top: 8px;
    background: var(--sky); border: 2px solid var(--indigo);
  }
  .reel__fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--wood); }

  .reel__hint { margin: 8px 0 0; color: var(--sky); font-size: 12px; text-align: center; }

  /* -------------------------------------------------------- catch card */
  .catch, .shop {
    position: absolute; inset: 0; z-index: 9;
    display: grid; place-items: center;
    background: var(--indigo);
  }
  .catch[hidden], .shop[hidden] { display: none; }
  .catch__card {
    padding: 16px 20px; text-align: center;
    background: var(--indigo);
    border: 4px solid var(--wood);
    max-width: min(92%, 22rem);
  }
  .catch__name { font-size: 20px; font-weight: 700; color: var(--sky); }
  /* Rarity is five blocks, filled up to the fish's tier: readable in three
     colours, where five hues would not have been. */
  .catch__rarity { display: flex; gap: 4px; justify-content: center; margin-top: 6px; }
  .catch__pip { width: 12px; height: 12px; background: var(--dim); }
  .catch__pip.is-on { background: var(--wood); }

  .catch__meta { color: var(--dim); margin-top: 6px; font-size: 12px; }
  .catch__value { font-size: 22px; font-weight: 700; margin-top: 8px; }

  /* ------------------------------------------------------------- shop */
  .shop__panel {
    width: min(100%, 30rem); max-height: 88%; overflow: auto;
    padding: 12px; text-align: left;
    background: var(--indigo); border: 4px solid var(--wood);
  }
  .shop__title { font-size: 16px; margin: 0 0 4px; color: var(--sky); }
  .shop__wallet { color: var(--dim); margin: 0 0 8px; font-size: 12px; }
  .shop__list { display: grid; gap: 4px; }

  .rod {
    display: grid; gap: 2px; text-align: left;
    padding: 8px;
    background: var(--sky);
    border: 2px solid var(--indigo);
    color: var(--indigo);
    font: inherit;
    cursor: pointer;
  }
  .rod:disabled { opacity: .6; cursor: not-allowed; }
  .rod--equipped { background: var(--wood); border-color: var(--wood); }
  .rod__row { display: flex; justify-content: space-between; gap: 8px; font-weight: 700; }
  .rod__stats, .rod__blurb { font-size: 11px; }
  .rod__blurb { font-style: italic; }

  .btn {
    padding: 6px 12px;
    background: var(--sky);
    color: var(--indigo);
    border: 2px solid var(--indigo);
    font: inherit; font-weight: 700;
    cursor: pointer;
  }
  .btn--primary { background: var(--wood); color: var(--indigo); border-color: var(--wood); }
  .btn:focus-visible, .rod:focus-visible, .shake:focus-visible { outline: 2px solid var(--wood); outline-offset: 2px; }

  .message {
    position: absolute; inset: auto 0 8px; z-index: 6;
    margin: 0; padding: 8px; text-align: center;
    background: var(--indigo); color: var(--ink);
  }
  .message[hidden] { display: none; }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="hud">
      <span>COIN <b id="coins">0</b></span>
      <span>ROD <b id="rod">—</b></span>
      <span class="hud__spacer"></span>
      <span class="hud__stat" id="rod-stats"></span>
    </div>

    <div class="lake" id="lake" data-phase="idle">
      <!-- The reference drawing rebuilt in crisp-edged SVG at percentage
           coordinates: stepped horizon rising to the right, pier on the left with
           deck and two legs, the angler and his rod. Sky, indigo and wood only. -->
      <svg class="scene" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true" focusable="false">
        <!-- far shore: a stepped skyline, climbing to the right -->
        <path fill="var(--indigo)" d="M0 78 L8 76 L14 79 L22 74 L30 77 L38 71 L46 73 L54 68 L62 70 L70 65 L78 67 L86 62 L94 64 L100 60 L100 100 L0 100 Z"/>
        <!-- water, with two flat highlight slabs -->
        <rect class="scene__glint" x="5" y="88" width="14" height="2"/>
        <rect class="scene__glint" x="62" y="92" width="18" height="2"/>
        <rect class="scene__glint" x="26" y="95" width="10" height="2"/>

        <!-- pier deck and its two legs -->
        <rect class="scene__wood" x="0" y="60" width="42" height="4"/>
        <rect class="scene__wood" x="9" y="64" width="5" height="36"/>
        <rect class="scene__wood" x="31" y="64" width="5" height="36"/>

        <!-- the angler: dome body over a round head -->
        <path class="scene__angler" d="M28 52 a5 5 0 0 1 10 0 z"/>
        <rect class="scene__angler" x="31" y="52" width="4" height="8"/>
        <circle class="scene__angler" cx="33" cy="40" r="4"/>

        <!-- the rod, angled up and to the right, with the lure at the tip -->
        <path class="scene__rod" d="M36 50 L55 30"/>
        <rect class="scene__wood" x="54" y="28" width="4" height="4"/>

        <!-- the fishing line: angler.js moves the far end to the bobber -->
        <path id="line" d="M56 32 Q58 40 60 48"/>
      </svg>

      <div class="lake__splash" id="splash"></div>
      <div class="lake__bobber" id="bobber" style="left:60%;top:70%"></div>

      <div class="cast" id="cast" hidden aria-hidden="true">
        <div class="cast__band"></div>
        <div class="cast__fill" id="cast-fill"></div>
      </div>

      <div class="reel" id="reel" hidden>
        <div class="reel__track" id="reel-track">
          <div class="reel__player" id="reel-player"></div>
          <div class="reel__fish" id="reel-fish"></div>
        </div>
        <div class="reel__progress"><div class="reel__fill" id="reel-fill"></div></div>
        <p class="reel__hint">HOLD <kbd>SPACE</kbd> — KEEP THE WOOD LINE INSIDE THE WHITE BAR</p>
      </div>

      <div class="catch" id="catch" hidden>
        <div class="catch__card">
          <div class="catch__name" id="catch-name">—</div>
          <div class="catch__rarity" id="catch-rarity" role="img" aria-label="Rarity"></div>
          <div class="catch__meta" id="catch-meta"></div>
          <div class="catch__value" id="catch-value">—</div>
          <button class="btn btn--primary" id="catch-again" type="button">CAST AGAIN</button>
        </div>
      </div>

      <div class="shop" id="shop-panel" hidden>
        <div class="shop__panel" role="dialog" aria-modal="true" aria-labelledby="shop-title">
          <h2 class="shop__title" id="shop-title">RODS</h2>
          <p class="shop__wallet">YOU HAVE <b id="shop-coins">0</b></p>
          <div class="shop__list" id="shop-list"></div>
          <p style="margin:10px 0 0"><button class="btn" id="shop-close" type="button">CLOSE</button></p>
        </div>
      </div>

      <p class="message" id="message" hidden></p>
    </div>

    <div class="hud" style="justify-content:space-between">
      <button class="btn" id="shop-open" type="button">RODS</button>
      <span id="bestiary" class="hud__dim"></span>
      <span>HOLD <kbd>SPACE</kbd> TO CAST</span>
    </div>
  </div>

  <script type="module" src="./angler.js?v=2026-10-01-b"></script>
</body>
</html>
