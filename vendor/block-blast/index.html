<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Block Blast</title>
<style>
  /* ---- design tokens -------------------------------------------------
   * Game-local, like vendor/fru-angler. tests/tokens.test.js only scans
   * styles.css, so nothing else would catch a typo'd token here — the
   * undefined-token test in tests/block-blast-look.test.js exists for that.
   */
  :root {
    --sky-top: #9fd8f7;
    --sky-mid: #cdeafb;
    --sky-floor: #f4fbff;
    --glass-top: rgba(255, 255, 255, 0.72);
    --glass-mid: rgba(255, 255, 255, 0.46);
    --glass-bot: rgba(255, 255, 255, 0.30);
    --hairline: rgba(255, 255, 255, 0.9);
    --hairline-strong: rgba(255, 255, 255, 0.98);
    --ink: #013a63;
    --ink-soft: #0e6ea8;
    --accent: #4fc3f7;
    --accent-line: #0288d1;
    --deep: #062b45;
    --cell-empty: rgba(255, 255, 255, 0.20);
    --cell-edge: rgba(255, 255, 255, 0.55);
    --shadow-panel: 0 18px 44px rgba(1, 87, 155, 0.34);
    --shadow-block: 0 5px 12px rgba(1, 40, 70, 0.34);
    --shadow-lift: 0 10px 24px rgba(1, 40, 70, 0.38);
    --radius: 12px;
    --radius-lg: 18px;
    --ease: cubic-bezier(0.22, 0.61, 0.36, 1);
    --cell: 46px;
    /* Set per element by app.js. The defaults keep a gem rendering sanely even
       before a block exists, and keep them declared tokens rather than magic
       values invented at the point of use. */
    --hue: 200;
    --w: 1;
    --h: 1;
  }

  html, body {
    margin: 0; min-height: 100%;
    color: var(--ink);
    font: 15px "Segoe UI", Frutiger, system-ui, sans-serif;
    -webkit-user-select: none; user-select: none;
  }

  body {
    display: grid; place-items: center; padding: 1rem;
    /* the Aero backdrop: a sun bloom over water, behind everything */
    background-image:
      radial-gradient(120% 70% at 78% 6%, rgba(255, 255, 255, 0.85), rgba(255, 255, 255, 0) 60%),
      repeating-linear-gradient(180deg, rgba(255, 255, 255, 0.10) 0 2px, transparent 2px 34px),
      linear-gradient(180deg, var(--sky-top), var(--sky-mid) 52%, var(--sky-floor));
  }

  .wrap { display: grid; gap: 0.9rem; justify-items: center; }

  .hud {
    display: flex; align-items: center; gap: 0.8rem;
    padding: 0.45rem 1rem; border-radius: 999px;
    background: linear-gradient(180deg, var(--glass-top), var(--glass-mid) 55%, var(--glass-bot));
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-panel), inset 0 1px 0 #fff;
    backdrop-filter: blur(10px) saturate(1.3);
    -webkit-backdrop-filter: blur(10px) saturate(1.3);
    font-weight: 700; color: var(--deep);
  }
  .hud__combo { color: var(--accent-line); }

  .board {
    position: relative;
    display: grid;
    grid-template-columns: repeat(8, var(--cell));
    grid-template-rows: repeat(8, var(--cell));
    gap: 3px; padding: 8px;
    border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--glass-top), var(--glass-bot));
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-panel), inset 0 1px 0 #fff;
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    touch-action: none;
  }

  .cell {
    position: relative;
    border-radius: 9px;
    background: var(--cell-empty);
    border: 1px solid var(--cell-edge);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.5);
  }

  /* A placed block: a glass gem lit from the upper left. The whole gem is built
   * from --hue, so one rule covers all sixteen blocks. */
  .cell[data-filled="true"],
  .block__cell {
    position: relative;
    border-radius: 9px;
    background: linear-gradient(180deg,
      hsl(var(--hue) 92% 78%) 0%,
      hsl(var(--hue) 84% 60%) 42%,
      hsl(var(--hue) 74% 40%) 74%,
      hsl(var(--hue) 66% 27%) 100%);
    border: 1px solid hsl(var(--hue) 80% 88% / 0.85);
    box-shadow:
      var(--shadow-block),
      inset 0 1px 0 hsl(var(--hue) 100% 92% / 0.9),
      inset 0 -2px 6px hsl(var(--hue) 70% 18% / 0.45);
  }

  /* The specular: a rotated radial highlight, the strongest single "glass" cue. */
  .cell[data-filled="true"]::after,
  .block__cell::after {
    content: "";
    position: absolute; left: 8%; top: 6%; width: 62%; height: 42%;
    border-radius: 50%;
    background: radial-gradient(circle at 34% 30%,
      rgba(255, 255, 255, 0.95), rgba(255, 255, 255, 0.28) 46%, rgba(255, 255, 255, 0) 72%);
    pointer-events: none;
  }

  .tray {
    display: flex; gap: 0.7rem; align-items: center;
    padding: 0.7rem 0.9rem; border-radius: var(--radius-lg);
    background: linear-gradient(180deg, var(--glass-top), var(--glass-bot));
    border: 1px solid var(--hairline);
    box-shadow: var(--shadow-panel), inset 0 1px 0 #fff;
    backdrop-filter: blur(12px) saturate(1.2);
    -webkit-backdrop-filter: blur(12px) saturate(1.2);
    min-height: 104px;
  }

  .tray__block {
    position: relative;
    width: calc(var(--w) * 26px);
    height: calc(var(--h) * 26px);
    border-radius: 10px;
    cursor: grab;
    transition: transform 140ms var(--ease), filter 140ms var(--ease);
    animation: block-float 3.6s ease-in-out infinite alternate;
  }
  .tray__block:hover { transform: translateY(-2px) scale(1.04); }
  .tray__block:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
  .tray__block.is-held {
    transform: translateY(-6px) scale(1.1);
    filter: drop-shadow(0 12px 18px rgba(1, 40, 70, 0.45));
    box-shadow: var(--shadow-lift);
  }
  /* Inside a tray block the cells are positioned by app.js from the block's own
     cell list, so the gem rule above gives them colour, gloss and a drop shadow. */
  .block__cell { position: absolute; }

  .over p { color: var(--ink-soft); }
  .over {
    padding: 1rem 1.6rem; border-radius: var(--radius-lg);
    background: linear-gradient(180deg, rgba(255, 255, 255, 0.95), var(--glass-mid));
    border: 1px solid var(--hairline-strong);
    box-shadow: var(--shadow-panel), inset 0 1px 0 #fff;
    text-align: center;
  }
  .over[hidden] { display: none; }
  .over p { margin: 0.2rem 0; }
  .over button {
    margin-top: 0.6rem; padding: 0.5rem 1.2rem; border-radius: var(--radius);
    border: 1px solid var(--hairline-strong);
    background: linear-gradient(180deg, #b2f5a0, #66bb6a);
    color: #10380f; font: inherit; font-weight: 800; cursor: pointer;
    box-shadow: 0 4px 0 #3f8f45, inset 0 1px 0 rgba(255, 255, 255, 0.7);
  }

  /* ---- motion --------------------------------------------------------- */

  @keyframes block-float {
    from { transform: translateY(0); }
    to   { transform: translateY(-4px); }
  }

  /* The placement preview: where the held block would land. */
  .cell.is-target {
    background: hsl(var(--hue, 200) 90% 70% / 0.45);
    border-color: hsl(var(--hue, 200) 95% 88% / 0.95);
    box-shadow: inset 0 0 0 2px rgba(255, 255, 255, 0.85), 0 0 12px rgba(255, 255, 255, 0.5);
  }

  /* A cell the block cannot use, so an illegal drop is visible before it happens. */
  .cell.is-blocked {
    background: rgba(229, 57, 53, 0.34);
    border-color: rgba(255, 190, 185, 0.9);
    box-shadow: inset 0 0 0 2px rgba(255, 170, 165, 0.75);
  }

  /* A block landing: a short settle, so the placement is felt but not sluggish. */
  @keyframes land {
    from { transform: scale(1.16); }
    to   { transform: scale(1); }
  }
  .cell[data-filled="true"] { animation: land 180ms var(--ease); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation: none !important;
      transition: none !important;
    }
  }

  @media (max-width: 460px) { :root { --cell: 38px; } }
</style>
</head>
<body>
  <div class="wrap">
    <div class="hud">
      <span>score <b id="score">0</b></span>
      <span class="hud__combo" id="combo"></span>
      <span>best <b id="best">0</b></span>
    </div>

    <!-- The grid. Filled in by app.js; 64 empty cells are the resting state. -->
    <div class="board" id="board" role="grid" aria-label="Block Blast board"></div>

    <!-- The three blocks you are holding. -->
    <div class="tray" id="tray" aria-label="Blocks to place"></div>

    <div class="over" id="over" hidden role="alertdialog" aria-labelledby="over-title">
      <p id="over-title"><b>No room left</b></p>
      <p>Final score <b id="final">0</b></p>
      <button id="again" type="button">Play again</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
