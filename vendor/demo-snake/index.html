<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  /* Frutiger Aero chrome to match the site around it. */
  html, body { margin: 0; height: 100%;
               background: linear-gradient(180deg, #e1f5fe, #b3e5fc 55%, #f4fbff);
               color: #06334f; font: 14px "Segoe UI", Frutiger, system-ui, sans-serif; overflow: hidden; }
  body { display: grid; place-items: center; }
  canvas { background: linear-gradient(180deg, #f7fdff, #d8f0fc);
           border: 1px solid rgba(255,255,255,.9); border-radius: 12px;
           box-shadow: 0 14px 30px rgba(1,87,155,.22), inset 0 1px 0 #fff;
           touch-action: none; }
  #hud { position: fixed; top: 10px; left: 12px; padding: .3rem .8rem; border-radius: 999px;
         background: linear-gradient(180deg, rgba(255,255,255,.9), rgba(255,255,255,.5));
         border: 1px solid rgba(255,255,255,.9); color: #01579b;
         box-shadow: 0 6px 14px rgba(1,87,155,.18), inset 0 1px 0 #fff; }
</style>
</head>
<body>
<div id="hud">score 0 · arrows/WASD to steer · space to pause</div>
<canvas id="board" width="480" height="480"></canvas>
<script>
  // Grid-based Snake. Named constants only — no magic numbers.
  const CELL = 20;
  const COLS = 24;
  const ROWS = 24;
  const STEP_MS = 110;
  const STEP_HALF_MS = 55;
  const MAX_QUEUED_TURNS = 3;
  const START_CELLS = [{ x: 8, y: 12 }, { x: 7, y: 12 }, { x: 6, y: 12 }];

  const canvas = document.getElementById('board');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const hudText = (score, suffix = 'arrows/WASD to steer · space to pause') =>
    `score ${score} · ${suffix}`;

  const DIRECTIONS = {
    ArrowUp: { x: 0, y: -1 }, KeyW: { x: 0, y: -1 },
    ArrowDown: { x: 0, y: 1 }, KeyS: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, KeyA: { x: -1, y: 0 },
    ArrowRight: { x: 1, y: 0 }, KeyD: { x: 1, y: 0 },
  };

  let snake, dir, queued, food, score, timer, paused, over;

  function reset() {
    snake = START_CELLS.map((cell) => ({ ...cell }));
    dir = { x: 1, y: 0 };
    queued = [];
    score = 0;
    paused = false;
    over = false;
    placeFood();
    hud.textContent = hudText(score);
  }

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * COLS), y: Math.floor(Math.random() * ROWS) };
    } while (snake.some((part) => part.x === food.x && part.y === food.y));
  }

  function step() {
    if (queued.length) {
      const next = queued.shift();
      // No instant 180s: a turn back into yourself is not a legal direction.
      if (next.x !== -dir.x || next.y !== -dir.y) dir = next;
    }
    const head = { x: (snake[0].x + dir.x + COLS) % COLS, y: (snake[0].y + dir.y + ROWS) % ROWS };
    if (snake.some((part) => part.x === head.x && part.y === head.y)) return gameOver();
    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score += 1;
      hud.textContent = hudText(score);
      placeFood();
    } else {
      snake.pop();
    }
  }

  function gameOver() {
    over = true;
    clearInterval(timer);
    hud.textContent = `game over — score ${score} · press R to restart`;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    // Food: a glossy red orb — high contrast against the pale board.
    ctx.fillStyle = '#e53935';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL / 2, food.y * CELL + CELL / 2, CELL * 0.36, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.75)';
    ctx.beginPath();
    ctx.arc(food.x * CELL + CELL * 0.38, food.y * CELL + CELL * 0.36, CELL * 0.11, 0, Math.PI * 2);
    ctx.fill();

    // Snake: saturated green with a lighter head, plus a gloss cap on every segment.
    snake.forEach((part, index) => {
      const x = part.x * CELL;
      const y = part.y * CELL;
      ctx.fillStyle = index === 0 ? '#1b8a4c' : '#2e9e5b';
      ctx.fillRect(x + 1, y + 1, CELL - 2, CELL - 2);
      ctx.fillStyle = 'rgba(255,255,255,.42)';
      ctx.fillRect(x + 1, y + 1, CELL - 2, (CELL - 2) * 0.42);
    });
    if (paused && !over) hud.textContent = hudText(score, 'paused — space to resume');
  }

  function startTimer() {
    clearInterval(timer);
    timer = setInterval(step, STEP_MS);
  }

  addEventListener('keydown', (event) => {
    const next = DIRECTIONS[event.code];
    if (next) {
      queued.push(next);
      if (queued.length < MAX_QUEUED_TURNS) event.preventDefault();
      return;
    }
    if (event.code === 'Space') {
      if (over) {
        reset();
        startTimer();
      } else if (paused) {
        startTimer();
        paused = false;
        hud.textContent = hudText(score); // draw() only rewrites while paused, so reset it here
      } else {
        clearInterval(timer);
        paused = true;
      }
      event.preventDefault();
      return;
    }
    if (event.code === 'KeyR') {
      reset();
      startTimer();
    }
  });

  reset();
  startTimer();
  setInterval(draw, STEP_HALF_MS);
</script>
</body>
</html>
