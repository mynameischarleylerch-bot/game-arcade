<!doctype html><meta charset="utf-8">
<style>
  body { margin:0; padding:24px; background:linear-gradient(180deg,#dff3ff,#9fd8f5 60%,#5cb8e8);
         font:14px system-ui,sans-serif; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:20px; max-width:1000px; }
  figure { margin:0; padding:14px; border-radius:18px; text-align:center;
           background:linear-gradient(180deg,rgba(255,255,255,.94),rgba(255,255,255,.6));
           border:1px solid rgba(255,255,255,.9);
           box-shadow:0 12px 28px rgba(1,87,155,.28), inset 0 1px 0 #fff; }
  .art svg { width:100%; height:auto; border-radius:14px; }
  figcaption { margin-top:8px; font-size:13px; color:#013a63; }
  /* also show them at index size, where they must still read */
  .small { display:flex; gap:12px; justify-content:center; align-items:center; margin-top:6px; }
  .small svg { width:40px; height:40px; border-radius:10px; }
</style>

      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>

    <!-- light spilling out of the fish; stronger on rare ones -->

      <stop offset="1" stop-color="hsl(195 100% 74%)" stop-opacity="0"/>

      fill="#ffffff" opacity="0.58"/>
    <circle class="bubbles" cx="83" cy="47" r="3.9"
      fill="#ffffff" opacity="0.34"/>

    <path class="belly" d="M40 52 C56 60 76 58 88 48 C76 58 56 62 40 54 Z"
          fill="#ffffff" opacity=".34"/>

    </g>

      <path d="M48 48 C56 45 64 45 72 47" stroke-width="1"/>

  <circle cx="72.8" cy="38" r="1.77" fill="#06334f"/>
  <circle cx="73.02" cy="36.64" r="0.68"

    <path class="sparkle" d="M31.4 28.9
      L33.1 32.5

  <rect class="surface" width="120" height="26" fill="url(#fa-glidefin-glass)"
        opacity=".38" rx="14"/>

  <!-- a Legendary or Mythical gets a crown of light above it -->
  
</svg></div>

    </linearGradient>
    <linearGradient id="fa-glacier-char-tail" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="hsl(275 72% 28%)"/>
      <stop offset="1" stop-color="hsl(275 68% 17%)"/>
    </linearGradient>
    <!-- the specular sweep across the back -->
    <radialGradient id="fa-glacier-char-sheen" cx="0.32" cy="0.22" r="0.6">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".85"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <!-- light spilling out of the fish; stronger on rare ones -->
    <radialGradient id="fa-glacier-char-bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="hsl(275 100% 82%)" stop-opacity="0.74"/>
      <stop offset="0.6" stop-color="hsl(275 100% 78%)" stop-opacity="0.36"/>
      <stop offset="1" stop-color="hsl(275 100% 74%)" stop-opacity="0"/>
    </radialGradient>
    <!-- the pond, deep at the bottom and bright at the surface -->
    <linearGradient id="fa-glacier-char-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eaf9ff"/>
      <stop offset="0.42" stop-color="#a9e2fb"/>
      <stop offset="0.78" stop-color="#5cc0ee"/>
      <stop offset="1" stop-color="#2b8fd0"/>
    </linearGradient>
    <!-- a glassy sheet of light lying on the water -->
    <linearGradient id="fa-glacier-char-glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="fa-glacier-char-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5.8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- the pond, deepest layer -->
  <rect width="120" height="80" rx="14" fill="url(#fa-glacier-char-water)"/>

  <!-- the sun burning through the surface, behind everything -->
  <circle class="bloom" cx="100" cy="14" r="26" fill="url(#fa-glacier-char-bloom)"/>
  <circle cx="100" cy="14" r="10" fill="#fffde7" opacity=".85"/>
  <circle cx="100" cy="14" r="6" fill="#ffffff" opacity=".9"/>

  <!-- caustics: the light ripples that say "underwater" -->
  <g class="caustics" fill="none" stroke="#ffffff" stroke-linecap="round">
    <path d="M8 22 C22 15 36 29 50 22 C64 15 78 29 92 22" stroke-width="2" opacity=".5"/>
    <path d="M12 34 C26 27 40 41 54 34 C68 27 82 41 96 34" stroke-width="1.6" opacity=".38"/>
    <path d="M6 46 C20 39 34 53 48 46 C62 39 76 53 90 46" stroke-width="1.4" opacity=".28"/>
  </g>

  <!-- bubbles rising through the water column -->
  <g class="bubbles">
    <circle class="bubbles" cx="14" cy="12" r="1.8"
      fill="#ffffff" opacity="0.34"/>
    <circle class="bubbles" cx="37" cy="43" r="2.5"
      fill="#ffffff" opacity="0.46"/>
    <circle class="bubbles" cx="60" cy="16" r="3.2"

    <circle class="bubbles" cx="56" cy="24" r="3.2"
      fill="#ffffff" opacity="0.34"/>
    <circle class="bubbles" cx="79" cy="55" r="3.9"
      fill="#ffffff" opacity="0.46"/>
  </g>

  <!-- the fish's own halo, so it sits in the light rather than on top of it -->
  <ellipse class="halo" cx="58" cy="40" rx="44" ry="26" fill="url(#fa-glacier-char-bloom)"
           opacity="0.78" filter="url(#fa-glacier-char-glow)"/>

  <!-- tail and fins first, so the body overlaps them -->
  <g filter="url(#fa-glacier-char-glow)">
    <path class="tail" d="M26 40 L4 18 L13 40 L4 64 Z" fill="url(#fa-glacier-char-tail)"/>
    <path class="fin" d="M54 26 C62 12 74 10 82 16 C74 20 66 28 58 38 Z" fill="url(#fa-glacier-char-fin)"/>
    <path class="body" d="M26 40 C38 22 74 18 90 30 C100 38 100 44 90 50 C74 62 38 58 26 40 Z" fill="url(#fa-glacier-char-body)" stroke="hsl(275 68% 17%)"
          stroke-width="1.1" stroke-opacity=".35"/>

    <!-- the belly, lit from below by the water -->
    <path class="belly" d="M40 52 C56 60 76 58 88 48 C76 58 56 62 40 54 Z"
          fill="#ffffff" opacity=".34"/>

    <!-- lateral stripes, in the deep tone so they read as depth not decoration -->
    <g class="stripe" stroke="hsl(275 68% 17%)" stroke-width="1.8" opacity=".42"
       stroke-linecap="round" fill="none">
      <path d="M40 28 L44 54 M52 25 L56 57 M64 24 L68 56 M76 26 L80 52"/>
    </g>

    <!-- the scale sheen: three offset arcs of light along the flank -->
    <g class="scales" fill="none" stroke="#ffffff" stroke-linecap="round" opacity=".3">
      <path d="M44 44 C52 40 60 40 68 43" stroke-width="1.2"/>
      <path d="M48 48 C56 45 64 45 72 47" stroke-width="1"/>
      <path d="M52 52 C60 50 68 50 76 51" stroke-width=".8"/>
    </g>
  </g>

  <!-- the specular sweep: the gloss cap that makes it read as glassy -->
  <ellipse class="specular" cx="50" cy="29" rx="19" ry="9" fill="url(#fa-glacier-char-sheen)"
           transform="rotate(-16 50 29)"/>

  <!-- the eye, with a highlight so it looks wet -->
  <circle class="eye" cx="82" cy="36" r="4.2" fill="#ffffff"/>
  <circle cx="82.8" cy="36" r="2.18" fill="#06334f"/>
  <circle cx="83.26" cy="34.32" r="0.84"
          fill="#ffffff"/>

  <!-- sparkles, more the rarer the fish -->
  <g class="sparkles">
    <path class="sparkle" d="M86.3 43.2
      L87.1 45.0
      L86.3 48.4
      L85.5 45.0 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M76.0 49.5
      L77.1 51.7
      L76.0 56.1
      L74.9 51.7 Z"
      fill="#ffffff" opacity="0.86"/>

      L57.9 54.1

      L56.3 54.1 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M40.1 48.0
      L41.2 50.2

      L39.0 50.2 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M28.0 40.8
      L28.8 42.6

      L27.2 42.6 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M32.6 30.9
      L33.7 33.1

      L31.5 33.1 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M43.4 24.6
      L44.2 26.4
      L43.4 29.8
      L42.6 26.4 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M62.5 21.8
      L63.6 24.0
      L62.5 28.4
      L61.4 24.0 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M80.7 26.1
      L81.5 27.9
      L80.7 31.3
      L79.9 27.9 Z"
      fill="#ffffff" opacity="0.86"/>
    <path class="sparkle" d="M87.8 33.3
      L88.9 35.5
      L87.8 39.9
      L86.7 35.5 Z"
      fill="#ffffff" opacity="0.86"/>
  </g>

  <!-- a soft shadow on the water under the fish -->
  <ellipse class="shadow" cx="56" cy="66" rx="34" ry="5"
           fill="#0a4a70" opacity=".18"/>

  <!-- the glassy surface sheet, catching the sun -->
  <rect class="surface" width="120" height="26" fill="url(#fa-glacier-char-glass)"
        opacity=".38" rx="14"/>

  <!-- a Legendary or Mythical gets a crown of light above it -->
  <g class="ring">
    <ellipse cx="58" cy="17" rx="26" ry="7" fill="none" stroke="#ffffff"
             stroke-width="1.6" opacity=".5"/>
    <ellipse cx="58" cy="17" rx="17" ry="4.6" fill="none" stroke="#fff9c4"
             stroke-width="1.2" opacity=".65"/>
  </g>
</svg>
