<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" role="img" aria-label="Aero avatar">
  <defs>
    <linearGradient id="body" x1="0.22" y1="0.05" x2="0.85" y2="1">
      <stop offset="0" stop-color="hsl(96 58% 74%)"/>
      <stop offset="0.42" stop-color="hsl(96 58% 54%)"/>
      <stop offset="1" stop-color="hsl(96 40% 26%)"/>
    </linearGradient>
    <radialGradient id="sheen" cx="0.36" cy="0.24" r="0.52">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="0.55" stop-color="#ffffff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shoulder" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="figure">
      <path d="M48 11 C58.5 11 67 19.5 67 30 C67 36 64.5 41.5 60 45 C64.5 45.6 68.5 47.2 72 50.2 C77.5 54.8 82 60 82 66 C82 70 80.5 72.6 78 74.6 C80.2 76.6 81.2 79 81.2 81.6 C81.2 86.6 68 89.6 48 89.6 C28 89.6 14.8 86.6 14.8 81.6 C14.8 79 15.8 76.6 18 74.6 C15.5 72.6 14 70 14 66 C14 60 18.5 54.8 24 50.2 C27.5 47.2 31.5 45.6 36 45 C31.5 41.5 29 36 29 30 C29 19.5 37.5 11 48 11 Z"/>
    </clipPath>
  </defs>

  <!-- transparent background, so the orb behind shows through -->
  <g clip-path="url(#figure)">
    <rect width="96" height="96" fill="url(#body)"/>
    <!-- the big specular highlight, up and to the left over the head -->
    <ellipse cx="37" cy="26" rx="15" ry="11" fill="url(#sheen)" transform="rotate(-24 37 26)"/>
    <!-- softer light on the far shoulder -->
    <ellipse cx="63" cy="52" rx="12" ry="9" fill="url(#shoulder)" transform="rotate(20 63 52)"/>
    <!-- ambient darkening along the lower right, to seat the form -->
    <ellipse cx="70" cy="84" rx="26" ry="16" fill="hsl(96 40% 26%)" opacity=".35"/>
  </g>
</svg>
