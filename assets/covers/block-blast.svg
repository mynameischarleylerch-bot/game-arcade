<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 160 90" role="img" aria-label="Block Blast">
  <title>Block Blast</title>
  <!--
    The listing cover. Same Aero recipe as the game: a sky ramp, a glass tray, and
    glossy gems lit from the upper left. The gems use the same four-stop
    light-to-deep ramp the game's blocks do, so the cover and the game match.
  -->
  <defs>
    <linearGradient id="bb-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9fd8f7"/>
      <stop offset="0.5" stop-color="#cdeafb"/>
      <stop offset="1" stop-color="#f4fbff"/>
    </linearGradient>
    <linearGradient id="bb-glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".72"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity=".30"/>
    </linearGradient>
    <radialGradient id="bb-sheen" cx="0.32" cy="0.24" r="0.62">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".92"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity=".26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bb-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffdf0" stop-opacity=".95"/>
      <stop offset="1" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>

    <!-- One ramp per gem hue: light top, deep belly, like the game's blocks. -->
    <linearGradient id="bb-h195" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#bde9fb"/><stop offset="0.42" stop-color="#5cc3ee"/>
      <stop offset="0.74" stop-color="#2b9fd4"/><stop offset="1" stop-color="#12688f"/>
    </linearGradient>
    <linearGradient id="bb-h200" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#b8e6fb"/><stop offset="0.42" stop-color="#54bdf0"/>
      <stop offset="0.74" stop-color="#2497d0"/><stop offset="1" stop-color="#0f6390"/>
    </linearGradient>
    <linearGradient id="bb-h168" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#bdf1e2"/><stop offset="0.42" stop-color="#5fd6b4"/>
      <stop offset="0.74" stop-color="#2aab8d"/><stop offset="1" stop-color="#0f7a63"/>
    </linearGradient>
    <linearGradient id="bb-h48" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#fdeed0"/><stop offset="0.42" stop-color="#f6c05a"/>
      <stop offset="0.74" stop-color="#d99420"/><stop offset="1" stop-color="#a86b12"/>
    </linearGradient>
    <linearGradient id="bb-h265" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#e2dcfb"/><stop offset="0.42" stop-color="#a894ef"/>
      <stop offset="0.74" stop-color="#7a63c9"/><stop offset="1" stop-color="#4c3797"/>
    </linearGradient>
    <linearGradient id="bb-h320" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#fbd7f0"/><stop offset="0.42" stop-color="#f28acb"/>
      <stop offset="0.74" stop-color="#d156a0"/><stop offset="1" stop-color="#9c2a70"/>
    </linearGradient>
    <linearGradient id="bb-h275" x1="0.18" y1="0" x2="0.72" y2="1">
      <stop offset="0" stop-color="#dedcfb"/><stop offset="0.42" stop-color="#9a97ec"/>
      <stop offset="0.74" stop-color="#6a63c4"/><stop offset="1" stop-color="#443aa0"/>
    </linearGradient>

    <filter id="bb-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="1.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="bb-gem"><rect width="14" height="14" rx="3.5"/></clipPath>
  </defs>

  <rect width="160" height="90" fill="url(#bb-sky)"/>
  <circle cx="136" cy="16" r="24" fill="url(#bb-sun)"/>

  <!-- the glass tray the grid sits in -->
  <rect x="24" y="16" width="112" height="60" rx="10" fill="url(#bb-glass)"
        stroke="#ffffff" stroke-opacity=".9" stroke-width="1.2"/>

  <!-- a cleared row blooming across the tray -->
  <g opacity=".75">
    <rect x="28" y="60" width="104" height="9" rx="4.5" fill="url(#bb-sheen)"/>
  </g>

  <!-- five glossy gems along the top, lit and shadowed -->
  <g filter="url(#bb-glow)">
    <g transform="translate(32 24)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h195)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
    <g transform="translate(50 24)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h200)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
    <g transform="translate(68 24)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h168)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
    <g transform="translate(86 24)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h48)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
    <g transform="translate(104 24)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h265)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
  </g>

  <!-- two more mid-fall, so it reads as a game in motion -->
  <g filter="url(#bb-glow)" opacity=".94">
    <g transform="translate(41 42)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h320)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
    <g transform="translate(77 42)">
      <rect width="14" height="14" rx="3.5" fill="url(#bb-h275)"/>
      <rect width="14" height="14" rx="3.5" fill="url(#bb-sheen)" clip-path="url(#bb-gem)"/>
    </g>
  </g>

  <text x="10" y="14" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600"
        style="paint-order:stroke;stroke:#01579b;stroke-width:3px">block blast</text>
</svg>