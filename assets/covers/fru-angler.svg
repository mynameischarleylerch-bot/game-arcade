<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 160 90" role="img" aria-label="Frutiger Angler">
  <defs>
    <linearGradient id="fa-cover-water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5aa6cf"/><stop offset="0.4" stop-color="#2f81c4"/><stop offset="1" stop-color="#1b5e9c"/>
    </linearGradient>
    <radialGradient id="fa-cover-sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff9c4" stop-opacity=".95"/><stop offset="1" stop-color="#fff9c4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="fa-cover-bob" cx="0.35" cy="0.3" r="0.7">
      <stop offset="0" stop-color="#ffffff"/><stop offset="0.62" stop-color="#e53935"/><stop offset="1" stop-color="#a3231f"/>
    </radialGradient>
  </defs>

  <rect width="160" height="90" fill="url(#fa-cover-water)"/>
  <circle cx="140" cy="14" r="20" fill="url(#fa-cover-sun)"/>

  <!-- soft clouds, Aero style -->
  <ellipse cx="34" cy="20" rx="22" ry="7" fill="#ffffff" opacity=".55"/>
  <ellipse cx="58" cy="26" rx="16" ry="5" fill="#ffffff" opacity=".4"/>

  <!-- far shore, rising to the right -->
  <path fill="#5aa6cf" d="M0 60 L16 57 L32 60 L48 54 L64 57 L80 51 L96 54 L112 47 L128 50 L144 43 L160 40 L160 90 L0 90 Z"/>
  <rect x="0" y="64" width="160" height="26" fill="url(#fa-cover-water)"/>
  <rect x="10" y="72" width="20" height="1.6" rx="0.8" fill="#ffffff" opacity=".3"/>
  <rect x="104" y="78" width="26" height="1.6" rx="0.8" fill="#ffffff" opacity=".3"/>

  <!-- pier: deck with a lit top edge, two legs -->
  <rect x="0" y="46" width="64" height="5" fill="#a9714a"/>
  <rect x="0" y="46" width="64" height="1.6" fill="#c68a5e"/>
  <rect x="13" y="51" width="6" height="39" fill="#7d4f2e"/>
  <rect x="44" y="51" width="6" height="39" fill="#7d4f2e"/>

  <!-- the angler, silhouetted with a red hat -->
  <rect x="47" y="35" width="4" height="11" rx="2" fill="#013a63"/>
  <circle cx="49" cy="28" r="4" fill="#013a63"/>
  <rect x="43" y="25" width="12" height="2.4" rx="1.2" fill="#e53935"/>

  <!-- rod, lure, line and bobber -->
  <path stroke="#7d4f2e" stroke-width="2.2" fill="none" stroke-linecap="round" d="M52 37 L78 16"/>
  <circle cx="79" cy="15" r="2.2" fill="#e53935"/>
  <path stroke="#ffffff" stroke-width="1" fill="none" opacity=".85" d="M80 17 Q92 32 110 58"/>
  <circle cx="113" cy="61" r="5.5" fill="url(#fa-cover-bob)"/>
  <ellipse cx="111" cy="59" rx="1.8" ry="1.4" fill="#ffffff" opacity=".8"/>
  <ellipse cx="113" cy="68" rx="9" ry="2.4" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".7"/>

  <text x="10" y="14" fill="#ffffff" font-family="Segoe UI, sans-serif" font-size="11" font-weight="600"
        style="paint-order:stroke;stroke:#01579b;stroke-width:3px">frutiger angler</text>
</svg>
