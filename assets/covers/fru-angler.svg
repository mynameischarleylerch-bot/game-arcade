<svg xmlns="http://www.w3.org/2000/svg" width="320" height="180" viewBox="0 0 160 90" role="img" aria-label="Frutiger Angler">
  <!-- The game's flat pixel palette: sky, indigo, wood. -->
  <rect width="160" height="90" fill="#00a2e8"/>

  <!-- stepped indigo horizon, climbing to the right -->
  <path fill="#3f48cc" d="M0 66 L10 64 L18 67 L28 61 L38 64 L48 57 L58 60 L68 53 L78 56 L88 50 L98 53 L108 46 L118 49 L128 43 L138 46 L148 40 L160 38 L160 90 L0 90 Z"/>
  <rect fill="#5a63d8" x="6" y="80" width="16" height="2"/>
  <rect fill="#5a63d8" x="92" y="84" width="20" height="2"/>
  <rect fill="#5a63d8" x="44" y="87" width="12" height="2"/>

  <!-- pier deck and legs -->
  <rect fill="#b97a57" x="0" y="50" width="58" height="4"/>
  <rect fill="#b97a57" x="12" y="54" width="6" height="36"/>
  <rect fill="#b97a57" x="40" y="54" width="6" height="36"/>

  <!-- the angler: dome body, round head -->
  <path fill="#3f48cc" d="M22 44 a6 6 0 0 1 12 0 z"/>
  <rect fill="#3f48cc" x="26" y="44" width="4" height="6"/>
  <circle fill="#3f48cc" cx="28" cy="30" r="4.5"/>

  <!-- rod up and to the right, lure at the tip, line down to the bobber -->
  <path stroke="#b97a57" stroke-width="2" fill="none" d="M31 42 L58 18"/>
  <rect fill="#b97a57" x="57" y="15" width="4" height="4"/>
  <path stroke="#3f48cc" stroke-width="1.2" fill="none" d="M59 19 Q70 34 88 56"/>
  <rect fill="#b97a57" x="84" y="52" width="8" height="8"/>
  <rect fill="#3f48cc" x="86" y="54" width="4" height="4"/>

  <!-- splash ring where it entered -->
  <rect fill="none" stroke="#ffffff" stroke-width="2" x="80" y="60" width="18" height="8"/>
</svg>
