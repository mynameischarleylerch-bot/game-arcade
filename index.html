<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arcade — my games</title>
<meta name="description" content="A small arcade of the games I build, playable right in the page.">
<link rel="stylesheet" href="./styles.css">
<link rel="icon" href="data:,">
</head>
<body>
<div class="scenery" aria-hidden="true">
  <div class="scenery__sun"></div>
  <div class="scenery__cloud scenery__cloud--a"></div>
  <div class="scenery__cloud scenery__cloud--b"></div>
  <div class="scenery__cloud scenery__cloud--c"></div>
  <div class="scenery__bubble scenery__bubble--1"></div>
  <div class="scenery__bubble scenery__bubble--2"></div>
  <div class="scenery__bubble scenery__bubble--3"></div>
  <div class="scenery__bubble scenery__bubble--4"></div>
  <div class="scenery__bubble scenery__bubble--5"></div>
  <div class="scenery__hill scenery__hill--far"></div>
  <div class="scenery__hill scenery__hill--near"></div>
</div>

<div class="shell">
<header class="hero">
  <h1 class="hero__title">Arcade</h1>
  <p class="hero__sub">Games I build. Each one plays right here in the page.</p>
</header>

<main class="panel">
  <div id="filters"></div>
  <div id="grid"><p class="empty">Loading…</p></div>
  <p id="error" class="error" hidden></p>
</main>

<footer class="footer panel panel--slim">
  <p>Built by <a href="https://github.com/karin" rel="noopener noreferrer">karin</a>. Every game links back to its source repo.</p>
</footer>
</div>
<script type="module" src="./src/app.js"></script>
</body>
</html>
