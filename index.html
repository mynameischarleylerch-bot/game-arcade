<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aero Arcade — my games</title>
<meta name="description" content="A small arcade of the games I build, playable right in the page.">
<link rel="stylesheet" href="./styles.css?v=2026-10-04-o">
<!-- The tab icon. This was href="data:,", an empty placeholder that renders
     nothing, so the browser tab was blank. -->
<link rel="icon" type="image/svg+xml" href="./assets/icon.svg?v=2026-10-04-o">
<link rel="apple-touch-icon" href="./assets/icon.svg?v=2026-10-04-o">
</head>
<body>
<div class="backdrop" aria-hidden="true"></div>

<div class="scenery" aria-hidden="true">
  <div class="scenery__sun"></div>
  <div class="scenery__cloud scenery__cloud--a"></div>
  <div class="scenery__cloud scenery__cloud--b"></div>
  <div class="scenery__cloud scenery__cloud--c"></div>
  <div class="scenery__bubble scenery__bubble--1"></div>
  <div class="scenery__bubble scenery__bubble--2"></div>
  <div class="scenery__bubble scenery__bubble--3"></div>
  <div class="scenery__bubble scenery__bubble--4"></div>
  <div class="scenery__bubble scenery__bubble--5"></div>
  <div class="scenery__hill scenery__hill--far"></div>
  <div class="scenery__hill scenery__hill--near"></div>
</div>

<div class="shell">
<header class="hero">
  <h1 class="hero__title">Aero Arcade</h1>
  <p class="hero__sub">Games I build. Each one plays right here in the page.</p>
  <div class="hero__bar">
    <button id="theme-toggle" class="btn btn--ghost hero__theme" type="button">Theme: Frutiger Aero</button>

    <!-- MSN Messenger contact card: avatar, status, and the 4x4 display-picture grid. -->
    <div class="msn" data-msn data-open="false">
      <button class="msn__toggle" type="button" data-msn-toggle aria-expanded="false">
        <span class="msn__face-wrap">
          <img class="msn__face" data-msn-face src="./assets/avatars/avatar-01.svg?v=2026-10-04-o" alt="" width="40" height="40">
          <span class="msn__dot" data-msn-dot></span>
        </span>
        <span class="msn__text">
          <span class="msn__label" data-msn-label>Online</span>
        </span>
      </button>

      <div class="msn__panel" data-msn-panel hidden>
        <p class="msn__hint" data-msn-hint></p>

        <h2 class="msn__title">Display picture</h2>
        <div class="msn__grid" data-msn-grid role="group" aria-label="Choose a display picture"></div>

        <h2 class="msn__title">Status</h2>
        <div class="msn__statuses" data-msn-statuses role="group" aria-label="Choose a status"></div>

        <label class="msn__nick-row">
          <span>Nickname</span>
          <input type="text" class="msn__nick" data-msn-nick maxlength="18" autocomplete="off" spellcheck="false">
        </label>
      </div>
    </div>
  </div>
</header>

<main class="panel">
  <div id="filters"></div>
  <div id="grid"><p class="empty">Loading…</p></div>
  <p id="error" class="error" hidden></p>
</main>

<footer class="footer panel panel--slim">
  <p>Built by <a href="https://github.com/mynameischarleylerch-bot" rel="noopener noreferrer">mynameischarleylerch-bot</a>. Every game links back to its source repo.</p>
</footer>
</div>
<script type="module" src="./src/app.js?v=2026-10-04-o"></script>
<script type="module">
  import { initThemeButton } from './src/theme-ui.js?v=2026-10-04-o';
  import { initAvatar } from './src/avatar-ui.js?v=2026-10-04-o';
  initThemeButton(window);
  initAvatar(document);
</script>
</body>
</html>
